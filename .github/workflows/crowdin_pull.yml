name: Crowdin pull and merge
on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

concurrency:
  group: crowdin-pull
  cancel-in-progress: false

jobs:
  pull:
    name: Pull translations from Crowdin
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      - name: Pull strings from Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: false
          download_translations: true
          skip_ref_checkout: true
          localization_branch_name: crowdin
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  merge:
    name: Import Crowdin translations into Dev
    if: github.event_name == 'workflow_dispatch'
    needs: pull
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      - name: Download translations onto dev
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: false
          download_translations: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Stage translation changes
        id: translations
        run: |
          git add -- \
            ':(glob)patches/src/main/resources/addresources/values-*/instagram/strings.xml' \
            ':(glob)patches/src/main/resources/addresources/values-*/shared/strings.xml' \
            ':(glob)patches/src/main/resources/addresources/values-*/twitter/strings.xml'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check translated strings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew checkStringResources --no-daemon

      - name: Commit translations to dev
        if: steps.translations.outputs.changed == 'true'
        run: |
          git fetch origin dev
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::dev changed during the import. Run this workflow again to check translations against the latest dev."
            exit 1
          fi
          git config --local user.name "Crowdin Bot"
          git config --local user.email "support+bot@crowdin.com"
          git commit -m "chore(translations): Update translations from Crowdin"
          git push origin HEAD:refs/heads/dev

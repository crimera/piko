name: "⭐ Instagram feature"
description: Request an Instagram feature.
title: "feature(Instagram): "
labels: ["enhancement", "instagram"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are accepted only for Instagram and Twitter.
        Search open and closed issues before posting. Keep the title prefix unchanged.

  - type: textarea
    id: feature
    attributes:
      label: What do you want?
      description: Describe the feature clearly.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why?
      description: State the use case and benefit.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Confirm
      options:
        - label: I searched open and closed issues; this is not a duplicate.
          required: true
        - label: This request is for Instagram.
          required: true
